<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #16181d;
    --muted: #656c78;
    --faint: #a3a9b4;
    --border: #e4e6ea;
    --border-strong: #d2d6dd;
    --head-bg: #f1f2f5;
    --head-hover: #e6e8ed;
    --row-alt: #fafbfc;
    --row-hover: #eff4ff;
    --sorted: rgba(37, 99, 235, 0.07);
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.11);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 28px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131417;
      --panel: #1c1d21;
      --text: #e8e9ec;
      --muted: #a0a5b0;
      --faint: #6d727c;
      --border: #2e3037;
      --border-strong: #3c3f47;
      --head-bg: #24262b;
      --head-hover: #2d2f36;
      --row-alt: #1f2024;
      --row-hover: #262a33;
      --sorted: rgba(122, 167, 255, 0.09);
      --accent: #7aa7ff;
      --accent-soft: rgba(122, 167, 255, 0.15);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.28);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    margin: 0 auto; padding: 40px 20px 64px; max-width: 1480px;
    background: var(--bg); color: var(--text);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 6px; }
  .summary { font-size: 14px; color: var(--muted); margin: 0 0 18px; }

  .hint {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin: 0 0 12px;
    font-size: 13px; color: var(--muted);
  }
  .hint b { color: var(--text); font-weight: 600; }
  kbd {
    font: inherit; font-size: 12px; padding: 1px 6px; margin: 0 1px;
    border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px;
    background: var(--head-bg); color: var(--text);
  }

  .sort-state {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin: 0 0 14px; min-height: 26px; font-size: 13px; color: var(--muted);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 11px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .chip .rank { opacity: 0.75; font-weight: 500; }

  .table-wrap {
    overflow-x: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
  th, td { padding: 12px 16px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th:last-child, td:last-child { text-align: center; }
  td { font-variant-numeric: tabular-nums; }

  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--head-bg); color: var(--muted);
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    border-bottom: 1px solid var(--border-strong); user-select: none;
  }
  thead th[data-type] { cursor: pointer; transition: background 0.12s ease, color 0.12s ease; }
  thead th[data-type]:hover { background: var(--head-hover); color: var(--text); }
  thead th[data-order] { color: var(--text); }
  thead th[data-type]::after { content: " ↕"; color: var(--faint); }
  thead th[data-order="asc"]::after { content: " ↑" attr(data-rank); color: var(--accent); }
  thead th[data-order="desc"]::after { content: " ↓" attr(data-rank); color: var(--accent); }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  tbody td.sorted { background: var(--sorted); }
  /* 사고 이력이 없는 값은 옅게 */
  tbody td:nth-child(6)[data-value="0"], tbody td:nth-child(7)[data-value="0"],
  tbody td[data-value=""] { color: var(--faint); }

  td a {
    display: inline-block; padding: 4px 13px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 600; text-decoration: none;
    transition: background 0.12s ease, color 0.12s ease;
  }
  td a:hover { background: var(--accent); color: #fff; }
  .thumbnail-cell { padding: 8px 12px; text-align: center; }
  td a.thumbnail-link { padding: 0; border-radius: 8px; overflow: hidden; vertical-align: middle; }
  .thumbnail-link img { display: block; width: 160px; height: 96px; object-fit: cover; }
  .thumbnail-placeholder {
    display: flex; align-items: center; justify-content: center;
    width: 160px; height: 96px; border-radius: 8px;
    background: var(--head-bg); color: var(--muted); font-size: 12px;
  }
  .thumbnail-link [hidden] { display: none; }

  @media (max-width: 640px) {
    body { padding: 24px 12px 40px; }
    h1 { font-size: 19px; }
    th, td { padding: 10px 11px; font-size: 13px; }
    .table-wrap { border-radius: 10px; }
  }
</style>
</head>
<body>
<h1>__TITLE__</h1>
<p class="summary">__SUMMARY__</p>
<p class="hint">
  열 제목을 클릭하면 해당 항목 하나로 정렬됩니다. (다시 클릭하면 오름차순/내림차순 전환)<br>
  <kbd>Shift</kbd> 또는 <kbd>⌘</kbd> + 클릭하면 정렬 조건이 순서대로 <b>추가</b>됩니다.
  (예: 명의 변경 ↑ → 가격 ↓) 추가된 조건은 오름차순 → 내림차순 → 해제 순으로 바뀝니다.
</p>
<p class="sort-state" id="sort-state"></p>
<div class="table-wrap">
<table>
<thead>
<tr>
  <th data-type="number" data-order="asc">번호</th>
  <th class="thumbnail-cell">사진</th>
  <th data-type="number">연식</th>
  <th data-type="number">명의 변경</th>
  <th data-type="number">가격</th>
  <th data-type="number">사고 횟수</th>
  <th data-type="number">평균 피해액</th>
  <th data-type="number">마일리지</th>
  <th>링크</th>
</tr>
</thead>
<tbody>
__ROWS__
</tbody>
</table>
</div>
<script>
(function () {
  var RANK_MARKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
  var table = document.querySelector('table');
  var tbody = table.tBodies[0];
  var headers = Array.prototype.slice.call(table.querySelectorAll('thead th'));
  var rows = Array.prototype.slice.call(tbody.rows);
  var stateBox = document.getElementById('sort-state');

  rows.forEach(function (row, idx) { row.dataset.origin = idx; });

  // 정렬 조건 목록. 앞에 있을수록 우선순위가 높다.
  var sortKeys = [{ idx: 0, asc: true }];

  function keyIndex(idx) {
    for (var i = 0; i < sortKeys.length; i++) {
      if (sortKeys[i].idx === idx) return i;
    }
    return -1;
  }

  function updateKeys(idx, additive) {
    var pos = keyIndex(idx);
    if (!additive) {
      // 단일 정렬: 이미 유일한 조건이면 방향만 전환
      var asc = !(sortKeys.length === 1 && pos === 0 && sortKeys[0].asc);
      sortKeys = [{ idx: idx, asc: asc }];
    } else if (pos === -1) {
      sortKeys.push({ idx: idx, asc: true });
    } else if (sortKeys[pos].asc) {
      sortKeys[pos].asc = false;
    } else {
      sortKeys.splice(pos, 1);
    }
  }

  function compare(a, b) {
    for (var i = 0; i < sortKeys.length; i++) {
      var key = sortKeys[i];
      var av = a.cells[key.idx].dataset.value;
      var bv = b.cells[key.idx].dataset.value;
      // 미확인 값은 정렬 방향과 관계없이 확인된 값 뒤에 둔다.
      var aMissing = av === undefined || av === '';
      var bMissing = bv === undefined || bv === '';
      if (aMissing !== bMissing) return aMissing ? 1 : -1;
      if (aMissing) continue;
      var diff = headers[key.idx].dataset.type === 'number'
        ? Number(av) - Number(bv)
        : String(av).localeCompare(String(bv), 'ko');
      if (diff) return key.asc ? diff : -diff;
    }
    // 모든 조건이 같으면 원래 순서 유지
    return Number(a.dataset.origin) - Number(b.dataset.origin);
  }

  function renderHeaders() {
    headers.forEach(function (th) {
      delete th.dataset.order;
      delete th.dataset.rank;
    });
    sortKeys.forEach(function (key, i) {
      var th = headers[key.idx];
      th.dataset.order = key.asc ? 'asc' : 'desc';
      if (sortKeys.length > 1) th.dataset.rank = RANK_MARKS[i] || String(i + 1);
    });
  }

  function renderState() {
    if (!sortKeys.length) {
      stateBox.innerHTML = '정렬 없음 (원래 순서)';
      return;
    }
    stateBox.innerHTML = '정렬 ' + sortKeys.map(function (key, i) {
      var mark = sortKeys.length > 1 ? '<span class="rank">' + (RANK_MARKS[i] || i + 1) + '</span>' : '';
      return '<span class="chip">' + mark + headers[key.idx].textContent +
        ' ' + (key.asc ? '↑' : '↓') + '</span>';
    }).join(' ');
  }

  function renderRows() {
    var sorted = rows.slice().sort(compare);
    var fragment = document.createDocumentFragment();
    sorted.forEach(function (row) {
      for (var i = 0; i < row.cells.length; i++) {
        row.cells[i].classList.toggle('sorted', keyIndex(i) !== -1);
      }
      fragment.appendChild(row);
    });
    tbody.appendChild(fragment);
  }

  function render() {
    renderHeaders();
    renderState();
    renderRows();
  }

  headers.forEach(function (th, idx) {
    if (!th.dataset.type) return;
    th.addEventListener('click', function (event) {
      updateKeys(idx, event.shiftKey || event.metaKey);
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
