<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    margin: 0; padding: 32px 20px; background: #fafafa; color: #1a1a1a;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .summary { font-size: 14px; color: #666; margin-bottom: 20px; }
  .hint { font-size: 13px; color: #888; margin-bottom: 8px; }
  .sort-state { font-size: 13px; color: #666; margin: 0 0 12px; min-height: 18px; }
  .sort-state b { font-weight: 600; }
  .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid #eee; }
  th:first-child, td:first-child, th:last-child, td:last-child { text-align: center; }
  thead th {
    position: sticky; top: 0; background: #f4f4f5; font-weight: 600;
    border-bottom: 1px solid #ddd; user-select: none;
  }
  thead th[data-type] { cursor: pointer; }
  thead th[data-type]:hover { background: #e9e9eb; }
  thead th[data-type]::after { content: " ↕"; color: #bbb; }
  thead th[data-order="asc"]::after { content: " ↑" attr(data-rank); color: #1a1a1a; }
  thead th[data-order="desc"]::after { content: " ↓" attr(data-rank); color: #1a1a1a; }
  tbody tr:hover { background: #f8f8fb; }
  tbody tr:last-child td { border-bottom: none; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #17171a; color: #e6e6e6; }
    .summary, .hint { color: #9a9a9a; }
    .sort-state { color: #b4b4b4; }
    .table-wrap { background: #1f1f23; border-color: #33333a; }
    th, td { border-bottom-color: #2b2b31; }
    thead th { background: #26262b; border-bottom-color: #38383f; }
    thead th[data-type]:hover { background: #2f2f36; }
    thead th[data-order="asc"]::after, thead th[data-order="desc"]::after { color: #e6e6e6; }
    tbody tr:hover { background: #26262b; }
    a { color: #7aa7ff; }
  }
</style>
</head>
<body>
<h1>__TITLE__</h1>
<p class="summary">__SUMMARY__</p>
<p class="hint">
  열 제목을 클릭하면 해당 항목 하나로 정렬됩니다. (다시 클릭하면 오름차순/내림차순 전환)<br>
  <b>Shift(또는 ⌘) + 클릭</b>하면 정렬 조건이 순서대로 <b>추가</b>됩니다.
  (예: 명의 변경 ↑ → 가격 ↓) 추가된 조건은 오름차순 → 내림차순 → 해제 순으로 바뀝니다.
</p>
<p class="sort-state" id="sort-state"></p>
<div class="table-wrap">
<table>
<thead>
<tr>
  <th data-type="number" data-order="asc">번호</th>
  <th data-type="number">명의 변경</th>
  <th data-type="number">가격</th>
  <th data-type="number">사고 횟수</th>
  <th data-type="number">평균 피해액</th>
  <th data-type="number">마일리지</th>
  <th>링크</th>
</tr>
</thead>
<tbody>
__ROWS__
</tbody>
</table>
</div>
<script>
(function () {
  var RANK_MARKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
  var table = document.querySelector('table');
  var tbody = table.tBodies[0];
  var headers = Array.prototype.slice.call(table.querySelectorAll('thead th'));
  var rows = Array.prototype.slice.call(tbody.rows);
  var stateBox = document.getElementById('sort-state');

  rows.forEach(function (row, idx) { row.dataset.origin = idx; });

  // 정렬 조건 목록. 앞에 있을수록 우선순위가 높다.
  var sortKeys = [{ idx: 0, asc: true }];

  function keyIndex(idx) {
    for (var i = 0; i < sortKeys.length; i++) {
      if (sortKeys[i].idx === idx) return i;
    }
    return -1;
  }

  function updateKeys(idx, additive) {
    var pos = keyIndex(idx);
    if (!additive) {
      // 단일 정렬: 이미 유일한 조건이면 방향만 전환
      var asc = !(sortKeys.length === 1 && pos === 0 && sortKeys[0].asc);
      sortKeys = [{ idx: idx, asc: asc }];
    } else if (pos === -1) {
      sortKeys.push({ idx: idx, asc: true });
    } else if (sortKeys[pos].asc) {
      sortKeys[pos].asc = false;
    } else {
      sortKeys.splice(pos, 1);
    }
  }

  function compare(a, b) {
    for (var i = 0; i < sortKeys.length; i++) {
      var key = sortKeys[i];
      var av = a.cells[key.idx].dataset.value;
      var bv = b.cells[key.idx].dataset.value;
      var diff = headers[key.idx].dataset.type === 'number'
        ? Number(av) - Number(bv)
        : String(av).localeCompare(String(bv), 'ko');
      if (diff) return key.asc ? diff : -diff;
    }
    // 모든 조건이 같으면 원래 순서 유지
    return Number(a.dataset.origin) - Number(b.dataset.origin);
  }

  function render() {
    headers.forEach(function (th) {
      delete th.dataset.order;
      delete th.dataset.rank;
    });
    sortKeys.forEach(function (key, i) {
      var th = headers[key.idx];
      th.dataset.order = key.asc ? 'asc' : 'desc';
      if (sortKeys.length > 1) th.dataset.rank = RANK_MARKS[i] || String(i + 1);
    });

    stateBox.innerHTML = sortKeys.length
      ? '정렬: ' + sortKeys.map(function (key) {
          return '<b>' + headers[key.idx].textContent + '</b> ' + (key.asc ? '오름차순' : '내림차순');
        }).join(' → ')
      : '정렬 없음 (원래 순서)';

    var sorted = rows.slice().sort(compare);
    var fragment = document.createDocumentFragment();
    sorted.forEach(function (row) { fragment.appendChild(row); });
    tbody.appendChild(fragment);
  }

  headers.forEach(function (th, idx) {
    if (!th.dataset.type) return;
    th.addEventListener('click', function (event) {
      updateKeys(idx, event.shiftKey || event.metaKey);
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
